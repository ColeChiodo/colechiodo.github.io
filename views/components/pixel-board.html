<h2>Draw a Picture</h2>
<a class="page-button" href="/gallery">View Gallery</a>
<div class="pixel-board" id="pixelBoard">
  <div class="pixel-board__form">
    <div class="pixel-board__palette">
      <button class="pixel-color" style="background:var(--black)" data-color="var(--black)"></button>
      <button class="pixel-color" style="background:var(--red)" data-color="var(--red)"></button>
      <button class="pixel-color" style="background:var(--green)" data-color="var(--green)"></button>
      <button class="pixel-color" style="background:var(--yellow)" data-color="var(--yellow)"></button>
      <button class="pixel-color" style="background:var(--blue)" data-color="var(--blue)"></button>
      <button class="pixel-color" style="background:var(--purple)" data-color="var(--purple)"></button>
      <button class="pixel-color" style="background:var(--aqua)" data-color="var(--aqua)"></button>
      <button class="pixel-color" style="background:var(--white)" data-color="var(--white)"></button>
    </div>
    <div id="pixelGrid" class="pixel-board__grid"></div>
    <input type="text" id="authorInput" name="author" placeholder="Your name" maxlength="12">
    <input type="text" id="descInput" name="description" placeholder="Short message" maxlength="36">
    <div id="submit-result"></div>
    <button id="submitBtn" hx-post="/art" hx-target="#submit-result" hx-swap="innerHTML" hx-include="#authorInput, #descInput">Post</button>
  </div>
</div>
