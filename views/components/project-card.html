<div class="project" data-url="{{url}}" style="--carousel: {{carousel}}; --mobile: {{mobile}}">
  <video data-src="{{image}}" poster="{{poster}}" loop muted playsinline preload="none" aria-label="{{alt}}"></video>
  <div class="project-info">
    <h3>{{title}}</h3>
    <p>{{description}}</p>
    <a class="view-project" href="{{url}}"{{target}}>View Project</a>
    <div class="project-tech">{{tech_icons}}</div>
  </div>
</div>
